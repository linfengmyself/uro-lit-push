name: uro-lit-daily
on:
  schedule:
    - cron: '0 0 * * *'    # 北京时间 08:00
    - cron: '0 15 * * *'   # 北京时间 23:00
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: run daily push
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
        run: python daily_uro_lit.py
      - name: commit state
        run: |
          git config user.name "uro-lit-bot"
          git config user.email "uro-lit-bot@users.noreply.github.com"
          git add sent_state.json
          git diff --cached --quiet || git commit -m "update push state [skip ci]"
          git push
